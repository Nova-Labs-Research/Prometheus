[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-lab"
version = "0.1.0"
description = "Research-only prototype for constrained self-improving AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "typer>=0.12,<1", "rich>=13,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.urls]
Repository = "https://github.com/Nova-Labs-Research/Prometheus"
Issues = "https://github.com/Nova-Labs-Research/Prometheus/issues"

[project.scripts]
prom-lab = "prometheus_lab.ui.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
