name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run CLI smoke test in a temporary directory
        shell: bash
        env:
          SAFE_LAB_BASE: ${{ runner.temp }}/prometheus-lab-${{ matrix.python-version }}
        # The CLI resolves audit paths from cwd; this variable alone is not a sandbox.
        run: |
          mkdir -p "$SAFE_LAB_BASE"
          cd "$SAFE_LAB_BASE"
          prom-lab run-dummy-loop
          prom-lab audit summary
          test -s artifacts/audit/events.jsonl
